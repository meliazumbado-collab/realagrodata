<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RealAgroData — Apoyo a decisiones de rotación con datos de la NASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{color-scheme:light}
.viz-root{
  --bg:#f4f3ef;--surface:#fcfcfb;--surface-2:#f7f6f2;--border:#e4e2db;
  --text-1:#0b0b0b;--text-2:#52514e;--text-3:#75746f;--grid:#ebe9e3;--axis:#c9c8c2;--hover:rgba(0,0,0,.04);
  --brand:#1d6b3a;--brand-soft:#e5f1e8;
  --s-base:#eb6834;--s-water:#2a78d6;--s-regen:#1baf7a;
  --c-prec:#6da7ec;--c-et:#a9a79f;--c-tmax:#8a5a00;--c-tmin:#6250d6;--c-frost:#3987e5;--c-heat:#ec835a;--c-critical:#d03b3b;
  --c-et-line:#75746f;--div-wet:#256abf;--div-dry:#e34948;--warn:#fab219;--serious:#ec835a;--critical:#d03b3b;--good:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){color-scheme:dark}
  :root:where(:not([data-theme="light"])) .viz-root{
    --bg:#121211;--surface:#1a1a19;--surface-2:#222220;--border:#2f2f2c;
    --text-1:#f0efec;--text-2:#c3c2b7;--text-3:#9a998f;--grid:#2a2a27;--axis:#4a4945;--hover:rgba(255,255,255,.05);
    --brand:#2f9a57;--brand-soft:#1d2f22;
    --s-base:#d95926;--s-water:#3987e5;--s-regen:#199e70;
    --c-prec:#5598e7;--c-et:#77766f;--c-tmax:#c98500;--c-tmin:#9085e9;--c-frost:#5598e7;
    --shadow:none;--c-et-line:#c3c2b7;--div-wet:#5598e7;--div-dry:#e66767;
  }
}
:root[data-theme="dark"] .viz-root{
  --bg:#121211;--surface:#1a1a19;--surface-2:#222220;--border:#2f2f2c;
  --text-1:#f0efec;--text-2:#c3c2b7;--text-3:#9a998f;--grid:#2a2a27;--axis:#4a4945;--hover:rgba(255,255,255,.05);
  --brand:#2f9a57;--brand-soft:#1d2f22;--s-base:#d95926;--s-water:#3987e5;--s-regen:#199e70;
  --c-prec:#5598e7;--c-et:#77766f;--c-tmax:#c98500;--c-tmin:#9085e9;--c-frost:#5598e7;--shadow:none;--c-et-line:#c3c2b7;--div-wet:#5598e7;--div-dry:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.viz-root{background:var(--bg);color:var(--text-1);min-height:100vh;padding:20px clamp(12px,3vw,36px) 40px;font-size:14px;line-height:1.5}
h2{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 4px;font-weight:600}
h4{margin:16px 0 6px;font-size:14px}
.small{font-size:12.5px}.muted{color:var(--text-2)}
code,.code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600;margin-bottom:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.brand-name{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand-tag{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:4px}
.brand-sub{font-size:12.5px;color:var(--text-2)}
.challenge{font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:99px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--text-2);cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--text-1);border-bottom-color:var(--brand)}
.tabs button:hover{color:var(--text-1)}
.controls{display:grid;grid-template-columns:1.25fr 1fr 1.1fr;gap:20px;margin-bottom:18px}
@media (max-width:1000px){.controls{grid-template-columns:1fr}}
.ctl-l{display:block;font-weight:600;font-size:13px;margin-bottom:8px}
.ctl-l.sm{font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:4px}
.ctl-l em{font-style:normal;color:var(--brand)}
.ctl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
select{width:100%;font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1)}
.fixed-val{font-size:13px;padding:8px 10px;border-radius:8px;border:1px dashed var(--brand);background:var(--brand-soft)}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hist select{padding:6px 8px;font-size:12.5px}
.loc-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc-card{text-align:left;font:inherit;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text-1)}
.loc-card.on{border-color:var(--brand);background:var(--brand-soft)}
.loc-name{font-weight:600;font-size:13.5px}
.loc-meta{font-size:11.5px;color:var(--text-2)}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prio-b{font:inherit;font-size:12.5px;font-weight:500;text-align:left;padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-1);cursor:pointer}
.prio-b.on{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.csv-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:6px}
.btn{display:inline-block;font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.csv-ok{color:var(--brand)}.csv-err{color:var(--critical)}
.section{margin:22px 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.badge{font-size:11.5px;padding:4px 10px;border-radius:99px;font-weight:600}
.badge.demo{background:rgba(250,178,25,.16);color:var(--text-1);border:1px solid rgba(250,178,25,.6)}
.badge.live{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand)}
.ctx-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px}
@media (max-width:1100px){.ctx-grid{grid-template-columns:1fr 1fr}.soilcard{grid-column:1/-1}}
@media (max-width:700px){.ctx-grid{grid-template-columns:1fr}}
.src{font-size:10.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.src-line{color:var(--text-2);margin-bottom:8px}
.soil-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px}
.soil-dl dt{font-weight:600;color:var(--text-2)}
.soil-dl dd{margin:0}
.soil-v{display:block}
.soil-p{display:block;color:var(--text-2);font-size:12px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2)}
.flag.warn{border-color:rgba(250,178,25,.7)}.flag.frost{border-color:var(--c-frost)}.flag.heat{border-color:var(--c-heat)}
.reco{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start;border-left:4px solid var(--brand)}
@media (max-width:900px){.reco{grid-template-columns:1fr}}
.reco h2{font-size:19px;line-height:1.45;margin:4px 0 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:middle}
.scores{display:flex;flex-direction:column;gap:8px}
.score-row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.score-name{display:flex;align-items:center;gap:6px}
.score-bar{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.score-bar div{height:100%;border-radius:0 4px 4px 0}
.score-v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.score-v sup{font-size:10px;color:var(--brand)}
.rules{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.rule{display:flex;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);border-left:4px solid var(--warn)}
.rule.critical{border-left-color:var(--critical)}.rule.serious{border-left-color:var(--serious)}
.rule-ico{font-size:18px}
.rule-t{font-weight:600;font-size:13px}
.rule-src{font-size:10.5px;font-weight:600;color:var(--text-2);background:var(--surface);border:1px solid var(--border);padding:1px 7px;border-radius:99px;margin-left:4px}
.conf{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.conf-t{font-size:13px}
.conf-ring{--p:50;width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--border) 0)}
.conf-ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700}
.conf-ring.big{width:84px;height:84px}.conf-ring.big span{width:66px;height:66px;font-size:18px}
.conf-big{display:flex;gap:18px;align-items:center;margin-bottom:12px}
.mbar{display:inline-block;width:80px;height:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.mbar div{height:100%;background:var(--brand)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums}
table.mini th,table.mini td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{color:var(--text-2);font-weight:600}
table.mini .hl{background:var(--brand-soft);font-weight:650}
table.mini tr.tot td{font-weight:700}
table.mini tr.sub td{color:var(--text-3);font-size:11.5px}
table.mini tr.saving td{color:var(--brand);font-weight:600}
.conf-table td:nth-child(4),.conf-table th:nth-child(4){text-align:left}.conf-table td:nth-child(3){white-space:nowrap}
.csv-cols td:last-child{text-align:left}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1050px){.cards3{grid-template-columns:1fr}}
.strat{border-top:4px solid var(--sc);display:flex;flex-direction:column;gap:8px}
.strat.best{outline:2px solid var(--sc);outline-offset:-1px}
.strat-top{display:flex;justify-content:space-between;align-items:center}
.strat-n{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:600}
.best-tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--sc)}
.strat-title{display:flex;align-items:center;gap:8px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border)}
.chip em{font-style:normal;color:var(--text-3)}
.chip-cover{border-style:dashed;border-color:var(--brand);color:var(--brand)}
.tillage{color:var(--text-2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.kpi-warn{border-color:var(--critical)}
.kpi-l{font-size:11.5px;color:var(--text-2)}
.kpi-v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi-flag{color:var(--critical);font-size:13px}
.delta{font-size:11px;font-weight:600;display:block}
.delta.good{color:var(--good)}.delta.bad{color:var(--critical)}
.bare-alert{font-size:12.5px;padding:7px 10px;border-radius:8px;background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.55)}
.bare-alert.high{background:rgba(208,59,59,.08);border-color:var(--critical)}
.why{margin:0;padding-left:18px;color:var(--text-2)}
.why li{margin:2px 0}
.chart{height:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 6px 4px}
.chart-desc{margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.two-tight{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start}
@media (max-width:1000px){.two-tight{grid-template-columns:1fr}}
.row-gap{display:flex;gap:10px;align-items:center}.row-gap.wrap{flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;border:none;background:none;padding:6px 11px;border-radius:7px;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text-1);font-weight:600;box-shadow:var(--shadow);outline:1px solid var(--border)}
.seg-sm button{padding:4px 9px;font-size:12px}
.link-btn{font:inherit;font-size:12.5px;background:none;border:none;color:var(--brand);cursor:pointer;text-decoration:underline;padding:0}
.tip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:180px}
.tip-h{font-weight:650;margin-bottom:4px}
.tip-r{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}
.tip-v{font-weight:600;font-variant-numeric:tabular-nums}
.term{border-bottom:1px dotted var(--text-2);cursor:help;position:relative}
.term-pop{display:none;position:absolute;left:0;top:130%;z-index:20;width:280px;background:var(--surface);color:var(--text-1);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12px;font-weight:400;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.term:hover .term-pop,.term:focus .term-pop{display:block}
.table-wrap{overflow:auto;max-height:360px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.data th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--text-2)}
table.data td:first-child,table.data th:first-child{text-align:left}
table.src-table td,table.src-table th{text-align:left;white-space:normal;vertical-align:top}
.src-table{min-width:860px}
.src-note{color:var(--text-2);margin-top:4px;max-width:340px}
.src-group{margin-bottom:16px}
.src-group h3{margin-bottom:8px}
.ndvi-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.ndvi-grid{display:grid;grid-template-columns:190px repeat(36,minmax(20px,1fr));gap:2px;min-width:960px}
.ndvi-label{font-size:12px;display:flex;align-items:center;gap:6px;padding-right:6px}
.ndvi-mh{font-size:10px;color:var(--text-3);text-align:center}
.ndvi-cell{height:30px;border-radius:4px;position:relative;display:grid;place-items:center;font-size:12px;font-weight:700;color:#5a2a10}
.ndvi-cell.ystart{box-shadow:-2px 0 0 var(--text-3)}
.ndvi-cell.bare{background:repeating-linear-gradient(45deg,rgba(236,131,90,.55) 0 3px,rgba(236,131,90,.15) 3px 7px);outline:1px solid var(--serious)}
.ndvi-cell.snow{background:var(--surface-2);outline:1px solid var(--border);color:var(--c-frost);font-weight:400}
.ndvi-cell.nodata{background:var(--surface-2);color:var(--text-3)}
.ndvi-crop{position:absolute;bottom:-1px;left:2px;font-size:8.5px;font-weight:600;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none}
.ndvi-legend{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;color:var(--text-2)}
.ramp{width:120px;height:10px;border-radius:4px;background:linear-gradient(90deg,rgb(241,238,224),rgb(22,101,52))}
.lg-bare,.lg-snow{display:inline-grid;place-items:center;width:20px;height:16px;border-radius:3px;font-weight:700}
.lg-bare{background:repeating-linear-gradient(45deg,rgba(236,131,90,.55) 0 3px,rgba(236,131,90,.15) 3px 7px);outline:1px solid var(--serious);color:#5a2a10}
.lg-snow{background:var(--surface-2);outline:1px solid var(--border);color:var(--c-frost)}
.detail{border-left:4px solid var(--sc)}
.detail-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.evid{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.evid li{display:grid;grid-template-columns:190px 90px 1fr;gap:10px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--border)}
@media (max-width:800px){.evid li{grid-template-columns:1fr}}
.evid-src{font-weight:600;font-size:12px;color:var(--brand)}
.evid-tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);justify-self:start}
.bare-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.bare-list li{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(250,178,25,.1);border:1px solid rgba(250,178,25,.5)}
.bare-list li.sev{background:rgba(208,59,59,.07);border-color:var(--critical)}
.gloss{display:grid;grid-template-columns:260px 1fr;gap:10px 18px;margin:0}
@media (max-width:800px){.gloss{grid-template-columns:1fr}}
.gloss dt{font-weight:600}.gloss dd{margin:0;color:var(--text-2)}
.limits-banner{padding:10px 14px;border-radius:10px;background:var(--brand-soft);border:1px solid var(--brand);margin-bottom:6px}
.update-note{border-left:4px solid var(--warn);margin-bottom:6px}
.update-note ul{margin:6px 0 0;padding-left:18px}
.update-note li{margin:4px 0}
.gs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.gs li{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px}
.gs li span{color:var(--text-2);font-size:12.5px}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
@media (max-width:900px){.pipe{grid-template-columns:1fr}}
.pipe-step{display:flex;flex-direction:column;gap:6px}
.pipe-n{font-weight:650;color:var(--brand)}
pre.code{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;overflow-x:auto;margin:10px 0}
.method li{margin:6px 0}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--border)}
button:focus-visible,select:focus-visible,.term:focus-visible,label.btn:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.note-warn{margin:6px 0 0;padding:6px 9px;border-radius:7px;background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.55)}
.risk-grid{display:grid;grid-template-columns:230px repeat(12,minmax(44px,1fr));gap:3px;overflow-x:auto;min-width:780px}
.risk{overflow-x:auto}
.risk-mh{text-align:center;font-size:11.5px;font-weight:600;color:var(--text-2);padding:3px 0;border-radius:5px}
.risk-mh.safe{background:var(--brand-soft);color:var(--brand)}
.risk-l{font-size:12px;display:flex;align-items:center}
.risk-c{--t:0;height:30px;border-radius:5px;display:grid;place-items:center;font-size:11.5px;font-variant-numeric:tabular-nums;border:1px solid var(--border)}
.risk-c.frost{background:color-mix(in srgb,#3987e5 calc(var(--t)*85%),var(--surface-2))}
.risk-c.heat{background:color-mix(in srgb,#e34948 calc(var(--t)*80%),var(--surface-2))}
.risk-c.rain{background:color-mix(in srgb,#6250d6 calc(var(--t)*75%),var(--surface-2))}
.risk-c.wet{background:color-mix(in srgb,#1baf7a calc(var(--t)*80%),var(--surface-2))}
.risk-c span{background:var(--surface);padding:0 4px;border-radius:3px;opacity:.92}
.events{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px}
.events li{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:2px 0}
.ndvi-cell.crit{outline:2px solid var(--critical);color:#3a1505;font-size:11px;letter-spacing:-1px}
.lg-bare.crit{outline:2px solid var(--critical);width:auto;padding:0 3px;font-size:10px}
.fix-box{padding:9px 12px;border-radius:9px;background:var(--brand-soft);border:1px solid var(--brand);margin-bottom:10px}
.live-tag{font-size:10px;font-weight:700;color:#fff;background:var(--brand);padding:1px 6px;border-radius:99px;margin-left:6px}
.disclaimer{border-left:4px solid var(--critical)}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.view-toggle{display:inline-flex;background:var(--surface);border:1.5px solid var(--brand);border-radius:12px;padding:3px;gap:3px}
.view-toggle button{font:inherit;font-size:13.5px;font-weight:600;border:none;background:none;padding:8px 14px;border-radius:9px;color:var(--text-2);cursor:pointer}
.view-toggle button.on{background:var(--brand);color:#fff}
.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.coords label{display:flex;flex-direction:column;font-size:12px;color:var(--text-2);gap:3px}
.coords input,.calc input{font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);width:100%}
.api-btn{grid-column:1/-1}
.btn:disabled{opacity:.6;cursor:wait}
.api-msg{margin-top:6px;padding:6px 9px;border-radius:7px;border:1px solid var(--border)}
.api-msg.ok{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.api-msg.fallback,.api-msg.error{border-color:rgba(250,178,25,.7);background:rgba(250,178,25,.1)}
.farm-card{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.switch-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;cursor:pointer;position:relative}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.switch-row .q{display:block;font-size:12.5px;font-weight:600}
.switch-row .h{display:block;font-size:11.5px;color:var(--text-2)}
.sw{width:38px;height:22px;border-radius:99px;background:var(--border);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch-row input:checked + .sw{background:var(--brand)}
.switch-row input:checked + .sw::after{left:19px}
.switch-row input:focus-visible + .sw{outline:2px solid var(--brand);outline-offset:2px}
.calc{margin-bottom:12px;border-left:4px solid var(--brand)}
.calc-title{font-weight:650;margin-bottom:10px}
.calc-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:14px;align-items:start}
@media (max-width:900px){.calc-grid{grid-template-columns:1fr}}
.calc-grid>label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.sub-box{display:flex;flex-direction:column;gap:6px}
.inline{font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inline input{width:90px}
.notill-alert{padding:7px 10px;border-radius:8px;background:rgba(250,178,25,.12);border:1px solid rgba(250,178,25,.6)}
.wet-alert{padding:6px 10px;border-radius:8px;background:rgba(57,135,229,.08);border:1px solid var(--c-frost)}
.farmer-hero{border-left:4px solid var(--brand);margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.farmer-hero h2{font-size:21px;line-height:1.45}
.light{--lc:var(--text-3);border:1px solid var(--border);border-left:6px solid var(--lc);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.light.green{--lc:var(--good)}.light.yellow{--lc:var(--warn)}.light.red{--lc:var(--critical)}.light.gray{--lc:var(--text-3)}
.light-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2)}
.light-dot{width:12px;height:12px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 25%,transparent)}
.light-ico{margin-left:auto;font-size:18px}
.light-title{font-weight:650;margin-top:4px}
.light-big{font-size:24px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.light-text{font-size:13px;color:var(--text-2)}
.light-sub{font-size:12.5px;margin-top:4px;font-weight:600}
.strat.farmer{gap:10px}
.mini-toggle{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.mini-toggle button{font:inherit;font-size:12px;font-weight:600;border:none;background:none;padding:6px 9px;border-radius:7px;color:var(--text-2);cursor:pointer}
.mini-toggle button.on{background:var(--surface-2);color:var(--text-1);outline:1px solid var(--border)}
.mini-toggle.lang span{padding:0 4px}
.search{display:flex;gap:6px}
.search input{flex:1;font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1)}
.results{margin-top:6px;display:flex;flex-direction:column;gap:3px;max-height:190px;overflow:auto}
.res-item{font:inherit;font-size:12.5px;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;cursor:pointer;color:var(--text-1)}
.res-item:hover{border-color:var(--brand)}
.presets{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.chip-btn{font:inherit;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);cursor:pointer}
.chip-btn.on{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.site-box{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);display:flex;flex-direction:column;gap:4px}
.site-name{font-weight:650;font-size:13px}
select:disabled{opacity:.75}
.yields{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.harvest{color:var(--text-2)}
.brand-sub b{color:var(--text-1)}
</style>
</head>

he soil before the months with > 30 mm downpours."],["Ne br\xFBlez pas les r\xE9sidus : laissez-les en paillis pendant la saison s\xE8che.","Semez du pois mascate ou du pois sabre en relais ~40 jours apr\xE8s le ma\xEFs de premi\xE8re saison.","Couvrez le sol avant les mois d'averses > 30 mm."]],"tips.mediterraneo":[["Mantenga el rastrojo en pie durante el verano; no queme ni labre.","Siembre veza o avena con las primeras lluvias de oto\xF1o, las m\xE1s erosivas.","Siembre en curvas de nivel en laderas."],["Keep standing stubble through summer; do not burn or till.","Sow vetch or oats with the first autumn rains, the most erosive.","Plant along contour lines on slopes."],["Gardez les chaumes debout l'\xE9t\xE9 ; ni br\xFBlage ni labour.","Semez vesce ou avoine aux premi\xE8res pluies d'automne, les plus \xE9rosives.","Semez selon les courbes de niveau sur les pentes."]],"tips.altiplano":[["Construya o mantenga terrazas y barreras vivas en ladera.","Deje rastrojo o avena forrajera tras la cosecha de papa.","Evite dejar el surco a favor de la pendiente."],["Build or keep terraces and living barriers on slopes.","Leave residue or forage oats after the potato harvest.","Avoid furrows running downslope."],["Construisez ou entretenez terrasses et haies vives en pente.","Laissez r\xE9sidus ou avoine fourrag\xE8re apr\xE8s la r\xE9colte de pommes de terre.","\xC9vitez les sillons dans le sens de la pente."]],"cf.t":["\xCDndice de Confianza del Dato: <b>{l} ({p} %)</b> con la arquitectura completa","Data Confidence Index: <b>{l} ({p} %)</b> with the full architecture","Indice de confiance des donn\xE9es : <b>{l} ({p} %)</b> avec l'architecture compl\xE8te"],"cf.demo":["En este prototipo: <b>{l} ({p} %)</b> \u2014 {why}","In this prototype: <b>{l} ({p} %)</b> \u2014 {why}","Dans ce prototype : <b>{l} ({p} %)</b> \u2014 {why}"],"cf.wPower":["capa clim\xE1tica e h\xEDdrica 100 % real (NASA POWER: lluvia, temperatura, GWETROOT, EVLAND); NDVI/HLS modelado; suelo e historial representativos.","climate and water layer 100 % real (NASA POWER: rain, temperature, GWETROOT, EVLAND); NDVI/HLS modelled; soil and history representative.","couche climatique et hydrique 100 % r\xE9elle (NASA POWER : pluie, temp\xE9rature, GWETROOT, EVLAND) ; NDVI/HLS mod\xE9lis\xE9 ; sol et historique repr\xE9sentatifs."],"cf.wRef":["clima de referencia aproximado de la zona (no de tu punto): conecte la API o cargue el CSV de NASA POWER.","approximate zone reference climate (not your point): connect the API or load the NASA POWER CSV.","climat de r\xE9f\xE9rence approximatif de la zone (pas votre point) : connectez l'API ou chargez le CSV NASA POWER."],"cf.more":["Ver c\xF3mo se calcula","See how it's calculated","Voir le calcul"],"cf.Alta":["Alta","High","\xC9lev\xE9e"],"cf.Moderada-alta":["Moderada-alta","Moderate-high","Mod\xE9r\xE9e \xE0 \xE9lev\xE9e"],"cf.Moderada":["Moderada","Moderate","Mod\xE9r\xE9e"],"cf.Baja":["Baja","Low","Faible"],"cf.comp":[["Clima","Suelo","Historial de cultivos","Humedad del suelo","Cobertura / NDVI","Evapotranspiraci\xF3n"],["Climate","Soil","Crop history","Soil moisture","Cover / NDVI","Evapotranspiration"],["Climat","Sol","Historique cultural","Humidit\xE9 du sol","Couverture / NDVI","\xC9vapotranspiration"]],"src.updK":["Nota de actualizaci\xF3n tecnol\xF3gica \xB7 noviembre 2026","Technology update note \xB7 November 2026","Note de mise \xE0 jour technologique \xB7 novembre 2026"],"src.upd":[["<b>Suomi NPP \u2192 NOAA-21 VIIRS.</b> Suomi NPP dej\xF3 de entregar datos el 2 de noviembre de 2026; se usa NOAA-21 (VJ2\u2026) como primaria y NOAA-20 (VJ1\u2026) como respaldo.","<b>HLS v2.0 como fuente principal de NDVI.</b> Landsat 8/9 + Sentinel-2A/B/C a 30 m; la revisita mediana mejor\xF3 de 1.6 d\xEDas (2022) a \u22481.4 d\xEDas (2025).","<b>Congelamiento con SPL3FTP, no L3_FT_A.</b> El producto activo de SMAP depend\xEDa del radar, que fall\xF3 en julio de 2015.","<b>ECOSTRESS Collection 2 como ET principal</b> en todas las regiones (OpenET solo cubre 23 estados del oeste de EE. UU.).","<b>Cobertura global:</b> cualquier coordenada se consulta en la API NASA POWER (2021\u20132025) y se clasifica en una de 4 zonas agroecol\xF3gicas; Madison y Guanacaste traen 1 826 d\xEDas reales precargados."],["<b>Suomi NPP \u2192 NOAA-21 VIIRS.</b> Suomi NPP stopped delivering data on 2 November 2026; NOAA-21 (VJ2\u2026) is primary and NOAA-20 (VJ1\u2026) backup.","<b>HLS v2.0 as the main NDVI source.</b> Landsat 8/9 + Sentinel-2A/B/C at 30 m; median revisit improved from 1.6 days (2022) to \u22481.4 days (2025).","<b>Freeze/thaw from SPL3FTP, not L3_FT_A.</b> SMAP's active product relied on the radar, which failed in July 2015.","<b>ECOSTRESS Collection 2 as the main ET source</b> everywhere (OpenET only covers 23 western US states).","<b>Global coverage:</b> any coordinate is queried from the NASA POWER API (2021\u20132025) and classified into one of 4 agro-ecological zones; Madison and Guanacaste ship with 1,826 real days preloaded."],["<b>Suomi NPP \u2192 NOAA-21 VIIRS.</b> Suomi NPP a cess\xE9 de livrer des donn\xE9es le 2 novembre 2026 ; NOAA-21 (VJ2\u2026) est primaire et NOAA-20 (VJ1\u2026) en secours.","<b>HLS v2.0 comme source principale de NDVI.</b> Landsat 8/9 + Sentinel-2A/B/C \xE0 30 m ; revisite m\xE9diane pass\xE9e de 1,6 jour (2022) \xE0 \u22481,4 jour (2025).","<b>Gel/d\xE9gel avec SPL3FTP, pas L3_FT_A.</b> Le produit actif de SMAP d\xE9pendait du radar, tomb\xE9 en panne en juillet 2015.","<b>ECOSTRESS Collection 2 comme source principale d'ET</b> partout (OpenET ne couvre que 23 \xC9tats de l'ouest des \xC9tats-Unis).","<b>Couverture mondiale :</b> toute coordonn\xE9e est interrog\xE9e dans l'API NASA POWER (2021\u20132025) et class\xE9e dans l'une des 4 zones agro-\xE9cologiques ; Madison et Guanacaste incluent 1 826 jours r\xE9els pr\xE9charg\xE9s."]],"src.traceK":["Trazabilidad","Traceability","Tra\xE7abilit\xE9"],"src.trace":["Qu\xE9 sat\xE9lite respalda cada m\xE9trica","Which satellite backs each metric","Quel satellite soutient chaque indicateur"],"src.cols":[["M\xE9trica","Producto","Resoluci\xF3n","Uso en el modelo","Regi\xF3n","Columna CSV"],["Metric","Product","Resolution","Use in the model","Region","CSV column"],["Indicateur","Produit","R\xE9solution","Usage dans le mod\xE8le","R\xE9gion","Colonne CSV"]],"src.inUse":["EN USO","IN USE","UTILIS\xC9"],"src.gsK":["Simetr\xEDa de precisi\xF3n","Precision symmetry","Sym\xE9trie de pr\xE9cision"],"src.gsWI":["Validaci\xF3n terrestre \xB7 EE. UU.","Ground validation \xB7 USA","Validation au sol \xB7 \xC9tats-Unis"],"src.gsCR":["Validaci\xF3n global \xB7 tr\xF3pico y resto del mundo","Global validation \xB7 tropics and rest of world","Validation mondiale \xB7 tropiques et reste du monde"],"src.nwis":["USGS NWIS valida caudal y nivel fre\xE1tico (tendencia de escorrent\xEDa y drenaje), no la humedad de cada parcela.","USGS NWIS validates streamflow and groundwater (runoff and drainage trends), not per-field moisture.","L'USGS NWIS valide d\xE9bits et nappes (tendances de ruissellement et drainage), pas l'humidit\xE9 de chaque parcelle."],"src.confK":["\xCDndice de Confianza del Dato","Data Confidence Index","Indice de confiance des donn\xE9es"],"src.conf":["C\xF3mo se calcula \xB7 {p}","How it is calculated \xB7 {p}","Mode de calcul \xB7 {p}"],"src.confP":["<b>{lp} ({pp} %)</b> con la arquitectura completa en producci\xF3n. En este prototipo: <b>{ld} ({pd} %)</b>.","<b>{lp} ({pp} %)</b> with the full production architecture. In this prototype: <b>{ld} ({pd} %)</b>.","<b>{lp} ({pp} %)</b> avec l'architecture compl\xE8te en production. Dans ce prototype : <b>{ld} ({pd} %)</b>."],"src.confNote":["Promedio ponderado de la calidad de cada capa seg\xFAn su resoluci\xF3n y la validaci\xF3n terrestre disponible. No se fija a mano: sube cuando entran datos reales de suelo (SSURGO/SoilGrids del pol\xEDgono), historial (CropScape) y NDVI (HLS).","Weighted average of each layer's quality by resolution and available ground validation. Not hand-set: it rises as real soil (SSURGO/SoilGrids polygon), history (CropScape) and NDVI (HLS) data come in.","Moyenne pond\xE9r\xE9e de la qualit\xE9 de chaque couche selon sa r\xE9solution et la validation au sol disponible. Non fix\xE9 \xE0 la main : il augmente avec des donn\xE9es r\xE9elles de sol (polygone SSURGO/SoilGrids), d'historique (CropScape) et de NDVI (HLS)."],"src.confCols":[["Componente","Peso","Puntaje (producci\xF3n)","Por qu\xE9","Disponible hoy"],["Component","Weight","Score (production)","Why","Available today"],["Composante","Poids","Score (production)","Pourquoi","Disponible aujourd'hui"]],"src.flowK":["Flujo de datos","Data flow","Flux de donn\xE9es"],"src.flow":["Formato CSV (NASA POWER / AppEEARS Point Samples)","CSV format (NASA POWER / AppEEARS Point Samples)","Format CSV (NASA POWER / AppEEARS Point Samples)"],"src.steps":[[["1 \xB7 Extraer","NASA POWER (diario) o AppEEARS Point Samples (SMAP L4, ECOSTRESS, HLS-VI, SRTM) para las coordenadas de la parcela."],["2 \xB7 Unir por fecha","Una fila por d\xEDa; celdas vac\xEDas si no hubo paso del sat\xE9lite o hab\xEDa nubes."],["3 \xB7 Cargar aqu\xED","RealAgroData agrega a meses, reemplaza el clima y recalcula las 3 estrategias."]],[["1 \xB7 Extract","NASA POWER (daily) or AppEEARS Point Samples (SMAP L4, ECOSTRESS, HLS-VI, SRTM) for the field coordinates."],["2 \xB7 Join by date","One row per day; empty cells when there was no overpass or clouds."],["3 \xB7 Load here","RealAgroData aggregates to months, replaces the climate and recalculates the 3 strategies."]],[["1 \xB7 Extraire","NASA POWER (journalier) ou AppEEARS Point Samples (SMAP L4, ECOSTRESS, HLS-VI, SRTM) pour les coordonn\xE9es de la parcelle."],["2 \xB7 Joindre par date","Une ligne par jour ; cellules vides sans passage satellite ou en cas de nuages."],["3 \xB7 Charger ici","RealAgroData agr\xE8ge par mois, remplace le climat et recalcule les 3 strat\xE9gies."]]],"src.copyT":["Copiar plantilla","Copy template","Copier le mod\xE8le"],"src.copyS":["Copiar CSV de ejemplo completo (2 a\xF1os)","Copy full sample CSV (2 years)","Copier le CSV d'exemple complet (2 ans)"],"src.copied":["\xA1Copiado!","Copied!","Copi\xE9 !"],"src.clipErr":["Tu navegador bloque\xF3 el portapapeles.","Your browser blocked the clipboard.","Votre navigateur a bloqu\xE9 le presse-papiers."],"src.disK":["Descargo de responsabilidad agron\xF3mica","Agronomic disclaimer","Avertissement agronomique"],"src.dis":["RealAgroData es una herramienta educativa de apoyo a decisiones. <b>No reemplaza el juicio del agricultor</b>, el conocimiento de su finca ni la asesor\xEDa de un agr\xF3nomo o extensionista. Rendimientos, precios y costos son referencias que cambian cada a\xF1o. Pruebe cualquier cambio primero en una parte peque\xF1a de la finca y valide con an\xE1lisis de suelo local.","RealAgroData is an educational decision-support tool. <b>It does not replace the farmer's judgement</b>, knowledge of the farm, or advice from an agronomist or extension agent. Yields, prices and costs are references that change every year. Try any change on a small part of the farm first and validate with a local soil test.","RealAgroData est un outil p\xE9dagogique d'aide \xE0 la d\xE9cision. <b>Il ne remplace pas le jugement de l'agriculteur</b>, la connaissance de sa ferme, ni les conseils d'un agronome ou conseiller. Rendements, prix et co\xFBts sont des r\xE9f\xE9rences qui changent chaque ann\xE9e. Testez tout changement sur une petite partie de la ferme et validez avec une analyse de sol locale."],"src.methK":["Metodolog\xEDa","Methodology","M\xE9thodologie"],"src.meth":["Modelos del motor de decisi\xF3n","Decision-engine models","Mod\xE8les du moteur de d\xE9cision"],"src.methL":[["<b>Clima (NASA POWER, datos reales):</b> series diarias 2021\u20132025 de T2M_MAX, T2M_MIN, PRECTOTCORR, GWETROOT y EVLAND agregadas a meses. ET\u2080 por Hargreaves-Samani (sin viento en estos archivos; con WS2M y RH2M se usar\xEDa Penman-Monteith FAO-56).","<b>Zonas agroecol\xF3gicas:</b> altiplano si |lat| < 35\xB0 y Tmedia anual < 15 \xB0C; templado si el mes m\xE1s fr\xEDo < 3 \xB0C; mediterr\xE1neo si lluvia < 600 mm o verano seco; tropical si el mes m\xE1s fr\xEDo \u2265 15 \xB0C. El calendario se desplaza al inicio local de temporada (temperatura \u2265 14 \xB0C, lluvias o lluvias de oto\xF1o).","<b>Alertas:</b> helada = Tmin < 0 \xB0C; estr\xE9s t\xE9rmico = Tmax > 32 \xB0C; lluvia extrema = > 30 mm/d\xEDa; anomal\xEDa h\xEDdrica = GWETROOT del mes \u2212 media del mismo mes.","<b>Balance h\xEDdrico mensual:</b> lluvia \u2212 escorrent\xEDa \u2212 ET real; ET = ET\u2080 \xD7 (Kcb + Ke) (FAO-56 dual), el rastrojo reduce la evaporaci\xF3n. Riego y encharcamiento seg\xFAn la validaci\xF3n de finca.","<b>Rendimiento:</b> FAO-33, 1 \u2212 Ya/Ym = ky \xB7 (1 \u2212 ETa/ETc).","<b>Erosi\xF3n:</b> RUSLE mensual A = R \xB7 K \xB7 LS \xB7 C; R de la lluvia, K del suelo (SSURGO/GAEZ/SoilGrids), LS de la pendiente (SRTM), C de la cobertura.","<b>Nitr\xF3geno:</b> balance parcial = fertilizante + fijaci\xF3n biol\xF3gica \u2212 remoci\xF3n en grano \u2212 lixiviaci\xF3n; cr\xE9ditos de leguminosa al estilo MRTN.","<b>Econom\xEDa:</b> margen bruto sin tierra, con costos editables, subsidios, alquiler de maquinaria y riego.","<b>Decisi\xF3n:</b> 55 % prioridad + 15 % cada objetivo restante, normalizado entre estrategias, m\xE1s ajustes por reglas agron\xF3micas."],["<b>Climate (NASA POWER, real data):</b> 2021\u20132025 daily series of T2M_MAX, T2M_MIN, PRECTOTCORR, GWETROOT and EVLAND aggregated to months. ET\u2080 via Hargreaves-Samani (no wind in these files; with WS2M and RH2M, FAO-56 Penman-Monteith would be used).","<b>Agro-ecological zones:</b> highland if |lat| < 35\xB0 and mean annual T < 15 \xB0C; temperate if coldest month < 3 \xB0C; Mediterranean if rain < 600 mm or dry summer; tropical if coldest month \u2265 15 \xB0C. The calendar is shifted to the local season start (T \u2265 14 \xB0C, rain onset or autumn rains).","<b>Alerts:</b> frost = Tmin < 0 \xB0C; heat stress = Tmax > 32 \xB0C; extreme rain = > 30 mm/day; water anomaly = month's GWETROOT \u2212 same-month mean.","<b>Monthly water balance:</b> rain \u2212 runoff \u2212 actual ET; ET = ET\u2080 \xD7 (Kcb + Ke) (dual FAO-56), residue lowers evaporation. Irrigation and waterlogging from the farm check.","<b>Yield:</b> FAO-33, 1 \u2212 Ya/Ym = ky \xB7 (1 \u2212 ETa/ETc).","<b>Erosion:</b> monthly RUSLE A = R \xB7 K \xB7 LS \xB7 C; R from rainfall, K from soil (SSURGO/GAEZ/SoilGrids), LS from slope (SRTM), C from cover.","<b>Nitrogen:</b> partial balance = fertiliser + biological fixation \u2212 grain removal \u2212 leaching; MRTN-style legume credits.","<b>Economics:</b> gross margin excluding land, with editable costs, subsidies, equipment rental and irrigation.","<b>Decision:</b> 55 % priority + 15 % each remaining goal, normalised across strategies, plus agronomic-rule adjustments."],["<b>Climat (NASA POWER, donn\xE9es r\xE9elles) :</b> s\xE9ries journali\xE8res 2021\u20132025 de T2M_MAX, T2M_MIN, PRECTOTCORR, GWETROOT et EVLAND agr\xE9g\xE9es par mois. ET\u2080 par Hargreaves-Samani (pas de vent dans ces fichiers ; avec WS2M et RH2M, Penman-Monteith FAO-56 serait utilis\xE9).","<b>Zones agro-\xE9cologiques :</b> altiplano si |lat| < 35\xB0 et T moyenne annuelle < 15 \xB0C ; temp\xE9r\xE9 si le mois le plus froid < 3 \xB0C ; m\xE9diterran\xE9en si pluie < 600 mm ou \xE9t\xE9 sec ; tropical si le mois le plus froid \u2265 15 \xB0C. Le calendrier est d\xE9cal\xE9 au d\xE9but de saison local (T \u2265 14 \xB0C, arriv\xE9e des pluies ou pluies d'automne).","<b>Alertes :</b> gel = Tmin < 0 \xB0C ; stress thermique = Tmax > 32 \xB0C ; pluie extr\xEAme = > 30 mm/jour ; anomalie hydrique = GWETROOT du mois \u2212 moyenne du m\xEAme mois.","<b>Bilan hydrique mensuel :</b> pluie \u2212 ruissellement \u2212 ET r\xE9elle ; ET = ET\u2080 \xD7 (Kcb + Ke) (FAO-56 dual), les r\xE9sidus r\xE9duisent l'\xE9vaporation. Irrigation et engorgement selon la validation de ferme.","<b>Rendement :</b> FAO-33, 1 \u2212 Ya/Ym = ky \xB7 (1 \u2212 ETa/ETc).","<b>\xC9rosion :</b> RUSLE mensuel A = R \xB7 K \xB7 LS \xB7 C ; R de la pluie, K du sol (SSURGO/GAEZ/SoilGrids), LS de la pente (SRTM), C de la couverture.","<b>Azote :</b> bilan partiel = engrais + fixation biologique \u2212 exportation par le grain \u2212 lixiviation ; cr\xE9dits de l\xE9gumineuses fa\xE7on MRTN.","<b>\xC9conomie :</b> marge brute hors foncier, co\xFBts modifiables, subventions, location de mat\xE9riel et irrigation.","<b>D\xE9cision :</b> 55 % priorit\xE9 + 15 % pour chaque autre objectif, normalis\xE9 entre strat\xE9gies, plus ajustements par r\xE8gles agronomiques."]],gl:[[["Evapotranspiraci\xF3n (ET\u2080 / ETc)","El agua que sale del campo hacia el aire: lo que se evapora del suelo m\xE1s lo que transpiran las plantas. ET\u2080 es la demanda del clima; ETc la del cultivo."],["NDVI","\xCDndice de 0 a 1, calculado con sat\xE9lites (HLS, VIIRS), que indica cu\xE1nta vegetaci\xF3n verde hay. ~0.1 = suelo desnudo; > 0.6 = cultivo denso."],["Anomal\xEDa de humedad (SMAP / GWETROOT)","Compara la humedad del suelo actual con lo normal para ese mes: negativa = m\xE1s seco de lo normal."],["Agua disponible del suelo","El agua que el suelo guarda y las ra\xEDces pueden usar. Por debajo de ~45 % el cultivo empieza a sufrir."],["Balance parcial de nitr\xF3geno","Entradas (fertilizante + N fijado por leguminosas) menos salidas (grano cosechado + lavado). Muy negativo = se mina el suelo; muy positivo = exceso que contamina."],["Fijaci\xF3n biol\xF3gica","Las leguminosas (soya, frijol, haba, tr\xE9bol, mucuna, garbanzo) toman nitr\xF3geno del aire gracias a bacterias en sus ra\xEDces."],["RUSLE","Ecuaci\xF3n del USDA que estima la p\xE9rdida de suelo: fuerza de la lluvia \xD7 erodabilidad \xD7 pendiente \xD7 cobertura."],["Tolerancia T","La p\xE9rdida m\xE1xima (~11 t/ha/a\xF1o) que un suelo tolera sin perder productividad a largo plazo."],["Cultivo de cobertura","Planta que se siembra para proteger el suelo entre cultivos, no para vender: centeno, tr\xE9bol, veza, mucuna, avena."],["Suelo descubierto (bare-field)","Meses sin plantas vivas ni rastrojo suficiente: el suelo es m\xE1s vulnerable a erosi\xF3n, p\xE9rdida de nutrientes y evaporaci\xF3n."]],[["Evapotranspiration (ET\u2080 / ETc)","Water leaving the field into the air: soil evaporation plus plant transpiration. ET\u2080 is the climate's demand; ETc the crop's."],["NDVI","A 0\u20131 index from satellites (HLS, VIIRS) showing how much green vegetation there is. ~0.1 = bare soil; > 0.6 = dense crop."],["Moisture anomaly (SMAP / GWETROOT)","Compares current soil moisture with normal for that month: negative = drier than normal."],["Plant-available water","Water the soil holds that roots can use. Below ~45 % the crop starts to suffer."],["Partial nitrogen balance","Inputs (fertiliser + N fixed by legumes) minus outputs (harvested grain + leaching). Very negative = mining the soil; very positive = polluting surplus."],["Biological fixation","Legumes (soybean, beans, faba, clover, velvet bean, chickpea) take nitrogen from the air through bacteria in their roots."],["RUSLE","USDA equation estimating soil loss: rainfall force \xD7 erodibility \xD7 slope \xD7 cover."],["Tolerance T","The maximum loss (~11 t/ha/yr) a soil can sustain without losing long-term productivity."],["Cover crop","A plant grown to protect the soil between cash crops, not to sell: rye, clover, vetch, velvet bean, oats."],["Bare-field period","Months with no living plants or enough residue: soil is most vulnerable to erosion, nutrient loss and evaporation."]],[["\xC9vapotranspiration (ET\u2080 / ETc)","L'eau qui quitte le champ vers l'air : \xE9vaporation du sol plus transpiration des plantes. ET\u2080 est la demande du climat ; ETc celle de la culture."],["NDVI","Indice de 0 \xE0 1, issu des satellites (HLS, VIIRS), qui indique la quantit\xE9 de v\xE9g\xE9tation verte. ~0,1 = sol nu ; > 0,6 = culture dense."],["Anomalie d'humidit\xE9 (SMAP / GWETROOT)","Compare l'humidit\xE9 actuelle du sol \xE0 la normale du mois : n\xE9gative = plus sec que la normale."],["Eau disponible du sol","L'eau que le sol retient et que les racines peuvent utiliser. Sous ~45 %, la culture commence \xE0 souffrir."],["Bilan partiel d'azote","Entr\xE9es (engrais + azote fix\xE9 par les l\xE9gumineuses) moins sorties (grain r\xE9colt\xE9 + lessivage). Tr\xE8s n\xE9gatif = sol appauvri ; tr\xE8s positif = exc\xE9dent polluant."],["Fixation biologique","Les l\xE9gumineuses (soja, haricot, f\xE8ve, tr\xE8fle, pois mascate, pois chiche) captent l'azote de l'air gr\xE2ce aux bact\xE9ries de leurs racines."],["RUSLE","\xC9quation de l'USDA estimant la perte de sol : force de la pluie \xD7 \xE9rodibilit\xE9 \xD7 pente \xD7 couverture."],["Tol\xE9rance T","La perte maximale (~11 t/ha/an) qu'un sol supporte sans perdre sa productivit\xE9 \xE0 long terme."],["Culture de couverture","Plante sem\xE9e pour prot\xE9ger le sol entre deux cultures, pas pour la vente : seigle, tr\xE8fle, vesce, pois mascate, avoine."],["P\xE9riode de sol nu","Mois sans plantes vivantes ni r\xE9sidus suffisants : le sol est le plus expos\xE9 \xE0 l'\xE9rosion, aux pertes de nutriments et \xE0 l'\xE9vaporation."]]],"lim.banner":["\u{1F9D1}\u200D\u{1F33E} RealAgroData <b>no reemplaza el juicio del agricultor</b>. Use estos resultados como punto de partida con su extensionista y pruebe cambios en una parte peque\xF1a de la finca antes de escalar.","\u{1F9D1}\u200D\u{1F33E} RealAgroData <b>does not replace the farmer's judgement</b>. Use these results as a starting point with your extension agent and test changes on a small part of the farm before scaling up.","\u{1F9D1}\u200D\u{1F33E} RealAgroData <b>ne remplace pas le jugement de l'agriculteur</b>. Utilisez ces r\xE9sultats comme point de d\xE9part avec votre conseiller et testez les changements sur une petite partie de la ferme."],"lim.gen":["Limitaciones generales","General limitations","Limites g\xE9n\xE9rales"],"lim.loc":["Validaci\xF3n local requerida","Local validation required","Validation locale requise"],"lim.list":[["Herramienta de apoyo a decisiones: no reemplaza el juicio del agricultor ni la asesor\xEDa local.","GWETROOT y EVLAND de NASA POWER provienen del rean\xE1lisis MERRA-2 (modelo), no de observaci\xF3n satelital directa; SMAP L4 y ECOSTRESS son las fuentes objetivo.","El NDVI est\xE1 modelado a partir de la cobertura esperada de cada cultivo; HLS/VIIRS reales entran en la siguiente fase.","Resoluci\xF3n: POWER ~0.5\xB0; una finca peque\xF1a puede comportarse distinto al p\xEDxel.","Rendimientos, precios y costos son referencias que cambian cada a\xF1o; para zonas fuera de EE. UU. y Costa Rica son ilustrativos.","El modelo de agua es un balde mensual de una capa; no simula aguaceros individuales ni napa fre\xE1tica.","El balance de N es parcial: no incluye volatilizaci\xF3n, desnitrificaci\xF3n, esti\xE9rcol ni mineralizaci\xF3n."],["Decision-support tool: it does not replace the farmer's judgement or local advice.","NASA POWER GWETROOT and EVLAND come from the MERRA-2 reanalysis (a model), not direct satellite observation; SMAP L4 and ECOSTRESS are the target sources.","NDVI is modelled from each crop's expected cover; real HLS/VIIRS comes in the next phase.","Resolution: POWER ~0.5\xB0; a small farm may behave differently from the pixel.","Yields, prices and costs are references that change every year; outside the US and Costa Rica they are illustrative.","The water model is a single-layer monthly bucket; it does not simulate individual storms or groundwater.","The N balance is partial: it excludes volatilisation, denitrification, manure and mineralisation."],["Outil d'aide \xE0 la d\xE9cision : il ne remplace ni le jugement de l'agriculteur ni le conseil local.","GWETROOT et EVLAND de NASA POWER proviennent de la r\xE9analyse MERRA-2 (un mod\xE8le), pas d'une observation satellitaire directe ; SMAP L4 et ECOSTRESS sont les sources cibles.","Le NDVI est mod\xE9lis\xE9 \xE0 partir de la couverture attendue de chaque culture ; HLS/VIIRS r\xE9els arrivent dans la phase suivante.","R\xE9solution : POWER ~0,5\xB0 ; une petite ferme peut diff\xE9rer du pixel.","Rendements, prix et co\xFBts sont des r\xE9f\xE9rences annuelles ; hors \xC9tats-Unis et Costa Rica, ils sont illustratifs.","Le mod\xE8le hydrique est un r\xE9servoir mensuel \xE0 une couche ; il ne simule ni les orages individuels ni la nappe.","Le bilan azot\xE9 est partiel : sans volatilisation, d\xE9nitrification, fumier ni min\xE9ralisation."]],"lim.ref":["El clima de este punto es una referencia aproximada de la zona: conecte la API NASA POWER o cargue el CSV del punto.","This point's climate is an approximate zone reference: connect the NASA POWER API or load the point's CSV.","Le climat de ce point est une r\xE9f\xE9rence approximative de la zone : connectez l'API NASA POWER ou chargez le CSV du point."],"lim.cr":["En Guanacaste tambi\xE9n hay Vertisoles (arcillas expansivas) muy distintos al Andisol/Inceptisol supuesto; los d\xEDas de 413\u2013466 mm (may-2024) conviene verificarlos con el IMN.","Guanacaste also has Vertisols (shrink-swell clays) very different from the assumed Andisol/Inceptisol; the 413\u2013466 mm days (May 2024) should be checked against IMN stations.","Le Guanacaste compte aussi des Vertisols (argiles gonflantes) tr\xE8s diff\xE9rents de l'Andisol/Inceptisol suppos\xE9 ; les jours \xE0 413\u2013466 mm (mai 2024) sont \xE0 v\xE9rifier aupr\xE8s de l'IMN."],"lim.wi":["Verifique dosis de N con la gu\xEDa MRTN de UW\u2013Madison Extension y cr\xE9ditos por leguminosa con an\xE1lisis PSNT.","Check N rates against the UW\u2013Madison Extension MRTN guide and legume credits with a PSNT test.","V\xE9rifiez les doses d'azote avec le guide MRTN de UW\u2013Madison Extension et les cr\xE9dits l\xE9gumineuses par un test PSNT."],"gt.type":["Tipo de suelo","Soil type","Type de sol"],"gt.water":["Agua disponible","Available water","Eau disponible"],"gt.k":["Erodabilidad (K)","Erodibility (K)","\xC9rodibilit\xE9 (K)"],"gt.season":["Calendario","Calendar","Calendrier"],"gt.frost":["Heladas (NASA POWER)","Frost (NASA POWER)","Gel (NASA POWER)"],"gt.waterP":["\u2248{w} mm en la zona de ra\xEDces \xB7 {om}","\u2248{w} mm in the root zone \xB7 {om}","\u2248{w} mm dans la zone racinaire \xB7 {om}"],"gt.kHigh":["Alta: la lluvia arrastra este suelo con facilidad; la cobertura es clave.","High: rain washes this soil away easily; cover is key.","\xC9lev\xE9e : la pluie emporte facilement ce sol ; la couverture est essentielle."],"gt.kMod":["Moderada: resiste mejor, pero los aguaceros intensos igual lo arrastran.","Moderate: more resistant, but intense downpours still wash it away.","Mod\xE9r\xE9e : plus r\xE9sistant, mais les fortes averses l'emportent quand m\xEAme."],"gt.frostWin":["\xDAltima de primavera: {a}; primera de oto\xF1o: {b}","Last spring frost: {a}; first autumn frost: {b}","Derni\xE8re gel\xE9e de printemps : {a} ; premi\xE8re d'automne : {b}"],"gt.noFrost":["Sin heladas en 2021\u20132025","No frost in 2021\u20132025","Pas de gel en 2021\u20132025"],"gt.srcSoil.madison":["USDA NRCS Web Soil Survey (SSURGO)","USDA NRCS Web Soil Survey (SSURGO)","USDA NRCS Web Soil Survey (SSURGO)"],"gt.srcSoil.guanacaste":["FAO GAEZ v4 + HWSD","FAO GAEZ v4 + HWSD","FAO GAEZ v4 + HWSD"],"gt.srcSoil.other":["ISRIC SoilGrids 250 m (valores representativos de la zona)","ISRIC SoilGrids 250 m (representative zone values)","ISRIC SoilGrids 250 m (valeurs repr\xE9sentatives de la zone)"]},yD={corn:["Ma\xEDz","Corn","Ma\xEFs"],cornShort:["Ma\xEDz ciclo corto (105 d)","Short-season corn (105 d)","Ma\xEFs pr\xE9coce (105 j)"],soy:["Soya","Soybean","Soja"],wheat:["Trigo de invierno","Winter wheat","Bl\xE9 d'hiver"],rye:["Centeno de cobertura","Cereal rye cover","Seigle de couverture"],ryeEarly:["Centeno (terminaci\xF3n temprana)","Rye (early termination)","Seigle (destruction pr\xE9coce)"],ryeLate:["Centeno interseembrado","Interseeded rye","Seigle en sursemis"],clover:["Tr\xE9bol rojo","Red clover","Tr\xE8fle violet"],oats:["Avena (muere con heladas)","Oats (winter-kill)","Avoine (g\xE9live)"],cebada:["Cebada de primavera","Spring barley","Orge de printemps"],alfalfa:["Alfalfa","Alfalfa","Luzerne"],maizP:["Ma\xEDz de primera","First-season maize","Ma\xEFs de premi\xE8re saison"],maizPo:["Ma\xEDz de postrera","Second-season maize","Ma\xEFs de seconde saison"],frijol:["Frijol de postrera","Second-season dry bean","Haricot de seconde saison"],arroz:["Arroz de secano","Upland rice","Riz pluvial"],sorgo:["Sorgo de postrera","Second-season sorghum","Sorgho de seconde saison"],sorgoP:["Sorgo de primera","First-season sorghum","Sorgho de premi\xE8re saison"],yuca:["Yuca","Cassava","Manioc"],mucuna:["Mucuna (frijol terciopelo)","Velvet bean","Pois mascate"],canavalia:["Canavalia","Jack bean","Pois sabre"],trigoDuro:["Trigo duro","Durum wheat","Bl\xE9 dur"],cebadaInv:["Cebada de invierno","Winter barley","Orge d'hiver"],girasol:["Girasol","Sunflower","Tournesol"],garbanzo:["Garbanzo","Chickpea","Pois chiche"],lenteja:["Lenteja","Lentil","Lentille"],veza:["Veza (vicia)","Vetch","Vesce"],avena:["Avena forrajera","Forage oats","Avoine fourrag\xE8re"],papa:["Papa","Potato","Pomme de terre"],maizAlt:["Ma\xEDz de altura","Highland maize","Ma\xEFs d'altitude"],haba:["Haba","Faba bean","F\xE8ve"],frijolArb:["Frijol arbustivo","Bush bean","Haricot nain"],quinua:["Quinua","Quinoa","Quinoa"],avenaAlt:["Avena forrajera de altura","Highland forage oats","Avoine fourrag\xE8re d'altitude"]},gD={Ma\u00EDz:["Ma\xEDz","Corn","Ma\xEFs"],Soya:["Soya","Soybean","Soja"],Trigo:["Trigo","Wheat","Bl\xE9"],Cebada:["Cebada","Barley","Orge"],Alfalfa:["Alfalfa","Alfalfa","Luzerne"],Centeno:["Centeno","Rye","Seigle"],Tr\u00E9bol:["Tr\xE9bol","Clover","Tr\xE8fle"],Avena:["Avena","Oats","Avoine"],Frijol:["Frijol","Dry bean","Haricot"],Arroz:["Arroz","Rice","Riz"],Sorgo:["Sorgo","Sorghum","Sorgho"],Yuca:["Yuca","Cassava","Manioc"],Mucuna:["Mucuna","Velvet bean","Pois mascate"],Canavalia:["Canavalia","Jack bean","Pois sabre"],"Trigo duro":["Trigo duro","Durum wheat","Bl\xE9 dur"],Girasol:["Girasol","Sunflower","Tournesol"],Garbanzo:["Garbanzo","Chickpea","Pois chiche"],Lenteja:["Lenteja","Lentil","Lentille"],Veza:["Veza","Vetch","Vesce"],Papa:["Papa","Potato","Pomme de terre"],Haba:["Haba","Faba bean","F\xE8ve"],Quinua:["Quinua","Quinoa","Quinoa"],Barbecho:["Barbecho","Fallow","Jach\xE8re"]},bD={"madison.water":[["Resiliencia h\xEDdrica","Ma\xEDz de ciclo corto \u2192 centeno con terminaci\xF3n temprana \u2192 soya \u2192 trigo de invierno \u2192 avena. Siembra directa para conservar rastrojo y humedad.","El trigo de invierno usa el agua de primavera y se cosecha antes del pico de evapotranspiraci\xF3n.","El centeno se termina temprano para no competir por agua con el cultivo siguiente.","El rastrojo sin labrar reduce la evaporaci\xF3n y aumenta la infiltraci\xF3n."],["Water resilience","Short-season corn \u2192 early-terminated rye \u2192 soybean \u2192 winter wheat \u2192 oats. No-till keeps residue and moisture.","Winter wheat uses spring water and is harvested before peak evapotranspiration.","Rye is terminated early so it does not compete for water with the next crop.","Untilled residue cuts evaporation and boosts infiltration."],["R\xE9silience hydrique","Ma\xEFs pr\xE9coce \u2192 seigle d\xE9truit t\xF4t \u2192 soja \u2192 bl\xE9 d'hiver \u2192 avoine. Le semis direct conserve r\xE9sidus et humidit\xE9.","Le bl\xE9 d'hiver utilise l'eau du printemps et se r\xE9colte avant le pic d'\xE9vapotranspiration.","Le seigle est d\xE9truit t\xF4t pour ne pas concurrencer la culture suivante.","Les r\xE9sidus non travaill\xE9s r\xE9duisent l'\xE9vaporation et augmentent l'infiltration."]],"madison.regen":[["Regeneraci\xF3n de suelo y nitr\xF3geno","Ma\xEDz + centeno interseembrado \u2192 soya \u2192 trigo de invierno con tr\xE9bol rojo al voleo. Tres cultivos comerciales y dos coberturas.","La rotaci\xF3n de 3 cultivos rompe el ciclo del gusano de la ra\xEDz del ma\xEDz y del nematodo de la soya.","El tr\xE9bol rojo fija nitr\xF3geno que reduce el abono del siguiente ma\xEDz.","Ra\xEDces vivas casi todo el a\xF1o alimentan la vida del suelo y capturan nitrato."],["Soil & nitrogen regeneration","Corn + interseeded rye \u2192 soybean \u2192 winter wheat frost-seeded with red clover. Three cash crops and two covers.","A 3-crop rotation breaks the corn rootworm and soybean cyst nematode cycles.","Red clover fixes nitrogen that cuts fertiliser for the next corn.","Living roots most of the year feed soil life and capture nitrate."],["R\xE9g\xE9n\xE9ration du sol et de l'azote","Ma\xEFs + seigle en sursemis \u2192 soja \u2192 bl\xE9 d'hiver avec tr\xE8fle violet sem\xE9 \xE0 la vol\xE9e. Trois cultures de rente et deux couverts.","Une rotation \xE0 3 cultures casse le cycle de la chrysom\xE8le et du n\xE9matode du soja.","Le tr\xE8fle violet fixe l'azote et r\xE9duit l'engrais du ma\xEFs suivant.","Des racines vivantes presque toute l'ann\xE9e nourrissent la vie du sol et captent le nitrate."]],"guanacaste.water":[["Resiliencia h\xEDdrica","Ma\xEDz de primera \u2192 frijol de ciclo corto en postrera; en el a\xF1o 2 el ma\xEDz se sustituye por sorgo. Rastrojo como mulch, sin quema.","El sorgo resiste mejor la can\xEDcula que el ma\xEDz.","El frijol de ciclo corto se cosecha antes de que se agote la humedad.","El mulch protege el suelo en la estaci\xF3n seca y mejora la infiltraci\xF3n."],["Water resilience","First-season maize \u2192 short-cycle beans in the second season; in year 2 maize is replaced by sorghum. Residue kept as mulch, no burning.","Sorghum handles the mid-summer drought better than maize.","Short-cycle beans are harvested before soil moisture runs out.","Mulch protects the soil in the dry season and improves infiltration."],["R\xE9silience hydrique","Ma\xEFs de premi\xE8re saison \u2192 haricot \xE0 cycle court en seconde saison ; en ann\xE9e 2, le ma\xEFs est remplac\xE9 par le sorgho. R\xE9sidus en paillis, sans br\xFBlis.","Le sorgho r\xE9siste mieux \xE0 la \xAB can\xEDcula \xBB que le ma\xEFs.","Le haricot \xE0 cycle court est r\xE9colt\xE9 avant l'\xE9puisement de l'humidit\xE9.","Le paillis prot\xE8ge le sol en saison s\xE8che et am\xE9liore l'infiltration."]],"guanacaste.regen":[["Regeneraci\xF3n de suelo y nitr\xF3geno","Ma\xEDz con mucuna en relevo (abono verde) \u2192 ma\xEDz \u2192 frijol de postrera \u2192 ma\xEDz con mucuna. El mulch de mucuna cubre la estaci\xF3n seca.","La mucuna fija 100\u2013150 kg N/ha y deja un mulch denso que suprime malezas.","Alternar gram\xEDneas y leguminosas reduce el gusano cogollero y los nematodos.","El mulch protege el suelo de los primeros aguaceros, los m\xE1s erosivos."],["Soil & nitrogen regeneration","Maize with relay velvet bean (green manure) \u2192 maize \u2192 second-season beans \u2192 maize with velvet bean. Velvet-bean mulch covers the dry season.","Velvet bean fixes 100\u2013150 kg N/ha and leaves a dense weed-suppressing mulch.","Alternating grasses and legumes reduces fall armyworm and nematodes.","Mulch protects the soil from the first, most erosive downpours."],["R\xE9g\xE9n\xE9ration du sol et de l'azote","Ma\xEFs avec pois mascate en relais (engrais vert) \u2192 ma\xEFs \u2192 haricot de seconde saison \u2192 ma\xEFs avec pois mascate. Le paillis couvre la saison s\xE8che.","Le pois mascate fixe 100\u2013150 kg N/ha et laisse un paillis dense contre les adventices.","Alterner gramin\xE9es et l\xE9gumineuses r\xE9duit la l\xE9gionnaire et les n\xE9matodes.","Le paillis prot\xE8ge le sol des premi\xE8res averses, les plus \xE9rosives."]],"mediterraneo.water":[["Resiliencia h\xEDdrica","Trigo duro \u2192 garbanzo de siembra tard\xEDa \u2192 cebada, en siembra directa conservando el rastrojo en verano.","El rastrojo en pie reduce la evaporaci\xF3n del verano.","El garbanzo usa menos agua que un cereal y aporta nitr\xF3geno.","La cebada madura antes y escapa del calor de inicio de verano."],["Water resilience","Durum wheat \u2192 late-sown chickpea \u2192 barley, all no-till keeping stubble through summer.","Standing stubble cuts summer evaporation.","Chickpea uses less water than a cereal and adds nitrogen.","Barley matures earlier and escapes early-summer heat."],["R\xE9silience hydrique","Bl\xE9 dur \u2192 pois chiche sem\xE9 tard \u2192 orge, en semis direct en gardant les chaumes l'\xE9t\xE9.","Les chaumes debout r\xE9duisent l'\xE9vaporation estivale.","Le pois chiche consomme moins d'eau qu'une c\xE9r\xE9ale et apporte de l'azote.","L'orge m\xFBrit plus t\xF4t et \xE9chappe \xE0 la chaleur du d\xE9but d'\xE9t\xE9."]],"mediterraneo.regen":[["Regeneraci\xF3n de suelo y nitr\xF3geno","Trigo duro \u2192 veza de cobertura en oto\xF1o \u2192 lenteja \u2192 trigo duro. Dos leguminosas en tres a\xF1os.","La veza cubre el suelo en las lluvias de oto\xF1o, las m\xE1s erosivas, y fija ~80 kg N/ha.","Romper el trigo continuo corta enfermedades del rastrojo.","La lenteja deja nitr\xF3geno y rastrojo para el trigo siguiente."],["Soil & nitrogen regeneration","Durum wheat \u2192 autumn vetch cover \u2192 lentil \u2192 durum wheat. Two legumes in three years.","Vetch covers the soil during the most erosive autumn rains and fixes ~80 kg N/ha.","Breaking continuous wheat cuts stubble-borne diseases.","Lentil leaves nitrogen and residue for the following wheat."],["R\xE9g\xE9n\xE9ration du sol et de l'azote","Bl\xE9 dur \u2192 vesce de couverture en automne \u2192 lentille \u2192 bl\xE9 dur. Deux l\xE9gumineuses en trois ans.","La vesce couvre le sol pendant les pluies d'automne, les plus \xE9rosives, et fixe ~80 kg N/ha.","Casser le bl\xE9 continu r\xE9duit les maladies des r\xE9sidus.","La lentille laisse azote et r\xE9sidus pour le bl\xE9 suivant."]],"altiplano.water":[["Resiliencia h\xEDdrica","Quinua (tolerante a sequ\xEDa y heladas) \u2192 papa con mulch \u2192 quinua. Labranza m\xEDnima en ladera.","La quinua rinde con poca lluvia y resiste heladas leves.","El mulch conserva humedad en los veranillos.","Menos labranza en ladera reduce la escorrent\xEDa."],["Water resilience","Quinoa (drought- and frost-tolerant) \u2192 potato with mulch \u2192 quinoa. Minimum tillage on slopes.","Quinoa yields with little rain and tolerates light frost.","Mulch conserves moisture during dry spells.","Less tillage on slopes reduces runoff."],["R\xE9silience hydrique","Quinoa (tol\xE9rant \xE0 la s\xE9cheresse et au gel) \u2192 pomme de terre paill\xE9e \u2192 quinoa. Travail minimal en pente.","Le quinoa produit avec peu de pluie et supporte les gel\xE9es l\xE9g\xE8res.","Le paillis conserve l'humidit\xE9 pendant les \xE9pisodes secs.","Moins de travail du sol en pente r\xE9duit le ruissellement."]],"altiplano.regen":[["Regeneraci\xF3n de suelo y nitr\xF3geno","Haba \u2192 papa \u2192 avena forrajera de cobertura \u2192 frijol arbustivo. Leguminosas antes y despu\xE9s de la papa.","La haba deja nitr\xF3geno que reduce el abono de la papa.","No repetir papa corta el ciclo del gorgojo de los Andes y del nematodo del quiste.","La avena cubre el suelo tras la cosecha y sirve de forraje."],["Soil & nitrogen regeneration","Faba bean \u2192 potato \u2192 forage-oat cover \u2192 bush bean. Legumes before and after potato.","Faba bean leaves nitrogen that cuts potato fertiliser.","Not repeating potato breaks the Andean weevil and cyst nematode cycles.","Oats cover the soil after harvest and provide forage."],["R\xE9g\xE9n\xE9ration du sol et de l'azote","F\xE8ve \u2192 pomme de terre \u2192 avoine fourrag\xE8re de couverture \u2192 haricot nain. L\xE9gumineuses avant et apr\xE8s la pomme de terre.","La f\xE8ve laisse de l'azote qui r\xE9duit l'engrais de la pomme de terre.","Ne pas r\xE9p\xE9ter la pomme de terre casse le cycle du charan\xE7on andin et du n\xE9matode \xE0 kyste.","L'avoine couvre le sol apr\xE8s la r\xE9c
